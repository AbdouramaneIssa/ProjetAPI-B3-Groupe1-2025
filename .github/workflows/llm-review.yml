name: LLM Review & Email Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

jobs:
  review_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # nécessaire pour le diff complet

      - name: Obtenir le diff de la PR
        id: diff
        shell: bash
        run: |
          echo "📄 Récupération du diff..."
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          base_sha=${{ github.event.pull_request.base.sha }}
          head_sha=${{ github.event.pull_request.head.sha }}
          git diff $base_sha $head_sha > diff.txt

          if [ ! -s diff.txt ]; then
            echo "Aucun changement détecté — fin du workflow."
            exit 0
          fi

          # Sauvegarde du diff dans la variable d'environnement
          {
            echo "diff_content<<EOF"
            cat diff.txt
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Appeler l'API Gemini
        id: llm_call
        shell: bash
        run: |
          echo "Appel à l'API Gemini..."
          response=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"contents\": [{\"parts\":[{\"text\": \"Tu es un relecteur de code expert. Analyse ce diff et écris une revue constructive en français :\\n\\n${{ env.diff_content }}\"}]}]}" \
            | jq -r '.candidates[0].content.parts[0].text')

          if [ -z "$response" ] || [ "$response" = "null" ]; then
            response="(Aucune réponse reçue de l'API Gemini)"
          fi

          {
            echo "response<<EOF"
            echo "$response"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Commenter sur la Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Revue LLM pour @${{ github.actor }}**\n\n${process.env.response}`
            })

      - name: Envoyer l'e-mail de notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Voici la revue générée par l'IA pour la Pull Request #${{ github.event.pull_request.number }} :

            Auteur : @${{ github.actor }}

            ---

            ${{ env.response }}
