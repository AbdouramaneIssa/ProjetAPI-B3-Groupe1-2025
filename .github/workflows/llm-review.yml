name: LLM Review & Email Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

jobs:
  review_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Récupérer le diff de la PR
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > diff.txt
          echo "diff_content<<EOF" >> $GITHUB_ENV
          cat diff.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Appeler Gemini API pour analyse du code
        id: llm_call
        run: |
          response=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"contents\": [{\"parts\":[{\"text\": \"Tu es un relecteur de code expert. Analyse ce diff et rédige un commentaire en français :\n\n${{ env.diff_content }}\"}]}]}" | jq -r '.candidates[0].content.parts[0].text')
          echo "response<<EOF" >> $GITHUB_ENV
          echo "$response" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Commenter sur la PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Revue LLM pour @${{ github.actor }}**\n\n${process.env.response}`
            })

      - name: Envoyer l'email de notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: "Voici la revue générée par l'IA :\n\n${{ env.response }}"
