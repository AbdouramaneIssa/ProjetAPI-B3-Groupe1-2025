name: LLM Review & Email Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

jobs:
  review_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ⚠️ Très important pour que git diff fonctionne correctement

      - name: Obtenir le diff de la PR
        id: diff
        run: |
          echo "📄 Récupération du diff de la PR..."
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          # Récupération des commits exacts pour éviter le "no merge base"
          base_sha=${{ github.event.pull_request.base.sha }}
          head_sha=${{ github.event.pull_request.head.sha }}
          echo "Comparaison entre $base_sha et $head_sha"
          git diff $base_sha $head_sha > diff.txt
          cat diff.txt
          echo "diff_content<<EOF" >> $GITHUB_ENV
          cat diff.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Appeler l'API Gemini pour l'analyse
        id: llm_call
        run: |
          echo "🤖 Appel à l'API Gemini..."
          response=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"contents\": [{\"parts\":[{\"text\": \"Tu es un relecteur de code expert. Analyse ce diff de code et écris un commentaire constructif en français :\n\n${{ env.diff_content }}\"}]}]}" \
          | jq -r '.candidates[0].content.parts[0].text')
          echo "response<<EOF" >> $GITHUB_ENV
          echo "$response" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Commenter sur la Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Revue LLM pour @${{ github.actor }}**\n\n${process.env.response}`
            })

      - name: Envoyer l'email de notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: "Voici la revue générée par l'IA :\n\n${{ env.response }}"
