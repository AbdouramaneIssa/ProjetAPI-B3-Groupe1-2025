repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: custom-linter
        name: Linter Personnalisé (Black, Flake8, Mypy)
        entry: python .git-hooks/pre-commit-wrapper.py
        language: python
        types: [python]
        stages: [pre-commit]
        always_run: true  # Changement ici
        pass_filenames: false # Changement ici
        additional_dependencies: [black, flake8, mypy]
